<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43"><title>FindVia Provider</title>
<style>
:root{--navy:#102a43;--blue:#1769e0;--blue2:#eaf2ff;--ink:#172b4d;--muted:#62748a;--line:#e4eaf1;--bg:#f5f7fb;--white:#fff;--green:#137a51;--greenbg:#e6f7ef;--amber:#946200;--amberbg:#fff4d6;--red:#b42318;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:72px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,42px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:-.4px}.brandmark{width:38px;height:38px;border-radius:12px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:900}.topright{display:flex;gap:10px;align-items:center}.pill{border-radius:999px;padding:7px 11px;background:var(--greenbg);color:var(--green);font-size:12px;font-weight:700}.iconbtn{border:1px solid var(--line);background:white;width:40px;height:40px;border-radius:12px;color:var(--ink);font-size:18px}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 72px)}.sidebar{padding:24px 14px;border-right:1px solid var(--line);background:#fff}.navlabel{text-transform:uppercase;font-size:10px;letter-spacing:1.3px;color:#8290a2;font-weight:800;padding:10px 12px}.navbtn{width:100%;border:0;background:transparent;text-align:left;display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;color:#52657a;font-weight:650;margin:2px 0}.navbtn .ico{width:22px;text-align:center;font-size:17px}.navbtn.active{background:var(--blue2);color:var(--blue)}.sidebarfoot{margin-top:30px;padding:14px;border-radius:14px;background:#f4f7fb;font-size:12px;color:var(--muted)}main{padding:clamp(18px,3vw,36px);min-width:0}.demo{background:var(--amberbg);color:#684900;border:1px solid #f1d98b;padding:11px 14px;border-radius:12px;font-size:12px;margin-bottom:22px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{color:var(--blue);font-weight:800;font-size:11px;letter-spacing:1.1px;text-transform:uppercase}.pagehead h1{margin:4px 0 5px;font-size:clamp(25px,3vw,32px);letter-spacing:-1px}.sub{color:var(--muted);margin:0}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:750;box-shadow:0 4px 10px #1769e018}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.small{padding:8px 11px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:19px;min-width:0}.stathead{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;font-weight:650}.staticon{width:34px;height:34px;border-radius:11px;background:var(--blue2);display:grid;place-items:center;font-size:17px}.statnum{font-size:27px;font-weight:850;letter-spacing:-.8px;margin:12px 0 4px}.statfoot{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.8fr);gap:18px}.cardtitle{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.cardtitle h2{font-size:16px;margin:0;letter-spacing:-.3px}.textlink{border:0;background:transparent;color:var(--blue);font-weight:750;font-size:12px}.jobrow{padding:15px 0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.jobrow:first-of-type{border-top:0}.jobleft{display:flex;gap:12px;align-items:flex-start;min-width:0}.jobicon{width:42px;height:42px;border-radius:13px;background:#f0f5ff;display:grid;place-items:center;font-size:20px;flex-shrink:0}.jobname{font-weight:800;margin-bottom:3px}.jobmeta{font-size:12px;color:var(--muted)}.tag{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#eef2f7;color:#52657a;font-size:10px;font-weight:800;white-space:nowrap}.tag.green{background:var(--greenbg);color:var(--green)}.tag.amber{background:var(--amberbg);color:var(--amber)}.balance{background:linear-gradient(135deg,#102a43,#174d85);color:#fff;border-radius:var(--radius);padding:22px;margin-bottom:18px}.balance .muted{color:#c7d9ec;font-size:12px}.amount{font-size:34px;font-weight:850;letter-spacing:-1px;margin:8px 0 17px}.balance .btn{background:#fff;color:var(--navy);box-shadow:none}.balance .btn.secondary{background:transparent;color:#fff;border-color:#ffffff55}.profilehead{display:flex;gap:15px;align-items:center}.avatar{width:62px;height:62px;border-radius:20px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-size:23px;font-weight:850}.profilelist{margin-top:20px}.settingrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.settingrow:first-child{border-top:0}.settingrow strong{display:block;font-size:13px}.settingrow span{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:14px;margin-bottom:8px}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:999px;white-space:nowrap;font-size:12px;font-weight:750}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.jobdetail{display:grid;grid-template-columns:1fr 300px;gap:18px}.detailsection{padding:16px 0;border-top:1px solid var(--line)}.detailsection h3{font-size:13px;margin:0 0 9px}.detailsection p{color:var(--muted);margin:0;font-size:13px}.formfield{display:grid;gap:6px;margin:12px 0}.formfield label{font-size:12px;font-weight:750}.formfield input,.formfield textarea,.formfield select{width:100%;border:1px solid #d5dee9;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink)}.formfield textarea{min-height:80px;resize:vertical}.notice{padding:13px;border-radius:12px;background:#f0f6ff;color:#345574;font-size:12px;margin:12px 0}.empty{padding:34px 12px;text-align:center;color:var(--muted)}.mobile-nav{display:none}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#102a43;color:#fff;padding:12px 17px;border-radius:12px;z-index:20;box-shadow:0 8px 28px #0002;max-width:90vw;font-size:13px}
@media(max-width:950px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.jobdetail{grid-template-columns:1fr}.sidebar{display:none}.layout{display:block}main{padding:18px 15px 95px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));justify-content:space-around}.mobile-nav .navbtn{display:flex;flex-direction:column;gap:3px;align-items:center;font-size:10px;padding:7px 5px;margin:0;flex:1}.mobile-nav .ico{font-size:18px}.mobile-nav .navbtn.active{background:transparent}.mobile-nav .navbtn.active .ico{background:var(--blue2);border-radius:10px;padding:4px 15px}.topbar{height:62px;padding:0 15px}.topright .pill{display:none}.brand{font-size:17px}.pagehead{align-items:center}.pagehead .btn{font-size:12px;padding:10px}.stat{padding:15px}.statnum{font-size:24px}}
@media(max-width:420px){.stats{gap:9px}.stat{padding:12px}.stathead{font-size:11px}.statnum{font-size:22px}.staticon{width:29px;height:29px}.jobrow{align-items:flex-start}.jobrow .btn{padding:8px;font-size:11px}.pagehead h1{font-size:25px}}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="brandmark">F</div><span>FindVia <span style="color:var(--muted);font-weight:600">Provider</span></span></div><div class="topright"><span class="pill">● Demo preview</span><button class="iconbtn" aria-label="Notifications" onclick="navigate('notifications')">♧</button><button class="iconbtn" aria-label="Profile" onclick="navigate('profile')">◉</button></div></header>
<div class="layout"><aside class="sidebar"><div class="navlabel">Workspace</div><nav id="sideNav"></nav><div class="sidebarfoot"><strong>FindVia Provider</strong><p style="margin:7px 0 0">Your service business, organized in one place.</p></div></aside><main><div class="demo"><strong>Prototype mode:</strong> This is the first UI foundation. Demo data is local to this page; login, Supabase, payments, OTP verification and real wallet operations are not connected yet.</div><div id="view"></div></main></div>
<nav class="mobile-nav" id="mobileNav"></nav></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const navItems=[{id:'home',label:'Home',ico:'⌂'},{id:'jobs',label:'Jobs',ico:'▣'},{id:'wallet',label:'Wallet',ico:'₹'},{id:'profile',label:'Profile',ico:'◉'},{id:'notifications',label:'Alerts',ico:'♧'}];
const jobs=[
{id:'FV-2048',category:'AC Repair',title:'AC cooling issue',area:'Malviya Nagar, Jaipur',time:'Today · 2:30 PM',price:1500,status:'Available',icon:'❄',description:'Split AC is running but not cooling properly. Please inspect and share an estimate.',schedule:'Today, 2:30 PM',notes:'Customer has requested an experienced technician.'},
{id:'FV-2047',category:'Plumbing',title:'Kitchen tap leakage',area:'Vaishali Nagar, Jaipur',time:'Today · 4:00 PM',price:650,status:'Available',icon:'🔧',description:'Kitchen sink tap has been leaking since yesterday.',schedule:'Today, 4:00 PM',notes:'Please bring standard plumbing tools.'},
{id:'FV-2046',category:'Electrical',title:'Ceiling fan installation',area:'Mansarovar, Jaipur',time:'Tomorrow · 10:00 AM',price:500,status:'Available',icon:'⚡',description:'Install one ceiling fan. Existing wiring is available.',schedule:'Tomorrow, 10:00 AM',notes:'Standard installation.'},
{id:'FV-2045',category:'Appliance Repair',title:'Washing machine check',area:'Jagatpura, Jaipur',time:'Tomorrow · 12:00 PM',price:900,status:'Matched',icon:'▤',description:'Washing machine is making an unusual sound.',schedule:'Tomorrow, 12:00 PM',notes:'Matched demo job.'}
];
let page='home',activeJob=jobs[0],jobTab='Available',offerSent=[],toastTimer;
function money(n){return '₹'+Number(n).toLocaleString('en-IN')}
function navMarkup(){return navItems.map(n=>'<button class="navbtn '+(page===n.id?'active':'')+'" onclick="navigate(\''+n.id+'\')"><span class="ico">'+n.ico+'</span><span>'+n.label+'</span></button>').join('')}
function renderNav(){document.getElementById('sideNav').innerHTML=navMarkup();document.getElementById('mobileNav').innerHTML=navMarkup()}
function heading(kicker,title,sub,action=''){return '<div class="pagehead"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div>'+action+'</div>'}
function stat(label,num,foot,ico){return '<div class="stat"><div class="stathead"><span>'+label+'</span><span class="staticon">'+ico+'</span></div><div class="statnum">'+num+'</div><div class="statfoot">'+foot+'</div></div>'}
function jobRow(j){return '<div class="jobrow"><div class="jobleft"><div class="jobicon">'+j.icon+'</div><div><div class="jobname">'+j.title+'</div><div class="jobmeta">'+j.category+' · '+j.area+'</div><div class="jobmeta" style="margin-top:5px">'+j.time+' · <strong>'+money(j.price)+'</strong></div></div></div><button class="btn secondary small" onclick="openJob(\''+j.id+'\')">'+(j.status==='Matched'?'View job':'View details')+'</button></div>'}
function home(){return heading('PROVIDER DASHBOARD','Good afternoon, Provider 👋','Here’s what is happening with your service business today.','<button class="btn" onclick="navigate(\'jobs\')">＋ Find jobs</button>')+
'<div class="stats">'+stat('Available jobs','12','Matching your categories','▣')+stat('Offers sent','04','2 awaiting response','↗')+stat('Active jobs','01','1 scheduled','◷')+stat('Net earnings',money(8450),'Demo total · this month','₹')+'</div>'+
'<div class="grid2"><section class="card"><div class="cardtitle"><h2>Jobs you may like</h2><button class="textlink" onclick="navigate(\'jobs\')">View all →</button></div>'+jobs.slice(0,3).map(jobRow).join('')+'</section><section><div class="balance"><div class="muted">Commission wallet balance</div><div class="amount">₹500.00</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="navigate(\'wallet\')">＋ Add money</button><button class="btn secondary" onclick="navigate(\'wallet\')">Transactions</button></div></div><div class="card"><div class="cardtitle"><h2>Profile completion</h2><span class="tag amber">In progress</span></div><div style="height:7px;border-radius:20px;background:#e8edf4;overflow:hidden"><div style="width:70%;height:100%;background:var(--blue);border-radius:20px"></div></div><p class="jobmeta" style="margin:10px 0 14px">70% complete · Add verification documents to continue.</p><button class="btn secondary small" onclick="navigate(\'profile\')">Complete profile</button></div></section></div>'}
function jobsPage(){const tabs=['Available','My Responses','Matched','Active','Completed','Cancelled'];let shown=jobTab==='Available'?jobs.filter(j=>j.status==='Available'):jobTab==='My Responses'?jobs.filter(j=>offerSent.includes(j.id)):jobs.filter(j=>j.status===jobTab);return heading('JOB MARKET','Jobs','Find service requests that match your skills and service areas.')+'<div class="tabs">'+tabs.map(t=>'<button class="tab '+(jobTab===t?'active':'')+'" onclick="jobTab=\''+t+'\';render()">'+t+'</button>').join('')+'</div><section class="card">'+(shown.length?shown.map(jobRow).join(''):'<div class="empty"><div style="font-size:28px;margin-bottom:8px">▣</div><strong>No '+jobTab.toLowerCase()+' jobs in this demo</strong><p>New matching requests will appear here when connected to FindVia.</p></div>')+'</section>'}
function openJob(id){activeJob=jobs.find(j=>j.id===id)||jobs[0];page='jobdetail';render()}
function jobDetail(){const j=activeJob;return '<button class="textlink" onclick="navigate(\'jobs\')">← Back to jobs</button><div style="height:14px"></div>'+heading('JOB DETAILS',j.title,j.id+' · '+j.category)+'<div class="jobdetail"><section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="tag">'+j.category+'</span><span class="tag green">'+j.status+'</span></div><div class="detailsection"><h3>Problem description</h3><p>'+j.description+'</p></div><div class="detailsection"><h3>Service area</h3><p>📍 '+j.area+'<br>Exact address is shared only after you are selected.</p></div><div class="detailsection"><h3>Preferred schedule</h3><p>◷ '+j.schedule+'</p></div><div class="detailsection"><h3>Additional notes</h3><p>'+j.notes+'</p></div><div class="notice">🔒 Customer phone, exact address, maximum budget and other providers’ offers stay private until the customer selects you.</div></section><aside class="card"><div class="cardtitle"><h2>Submit your offer</h2></div><p class="jobmeta">Enter your own price. Sending an offer is free.</p><form onsubmit="submitOffer(event,\''+j.id+'\')"><div class="formfield"><label for="offerPrice">Your price (₹)</label><input id="offerPrice" type="number" min="1" step="1" placeholder="e.g. 1200" required></div><div class="formfield"><label for="offerNote">Note (optional)</label><textarea id="offerNote" maxlength="500" placeholder="Share your experience or what is included"></textarea></div><button class="btn" style="width:100%" type="submit">Submit offer</button></form><div class="notice">This prototype does not send offers to a real customer yet.</div></aside></div>'}
function submitOffer(e,id){e.preventDefault();if(!offerSent.includes(id))offerSent.push(id);notify('Demo offer saved locally. Supabase connection is still pending.');page='jobs';jobTab='My Responses';render()}
function wallet(){return heading('FINANCES','Wallet & earnings','Track your commission balance, top-ups and service earnings.')+'<div class="grid2"><section><div class="balance"><div class="muted">Available commission wallet balance</div><div class="amount">₹500.00</div><div class="muted">Demo balance · not real money</div></div><div class="card"><div class="cardtitle"><h2>Add money</h2><span class="tag amber">Not connected</span></div><div class="tabs" id="amounts">'+[100,200,500,1000,2000,5000].map(a=>'<button class="tab" onclick="selectAmount('+a+',this)">'+money(a)+'</button>').join('')+'</div><div class="formfield"><label for="customAmount">Custom amount (₹)</label><input id="customAmount" type="number" min="1" max="50000" placeholder="Enter amount"></div><button class="btn" onclick="topUp()">Continue to payment</button><div class="notice">A payment gateway and server-side payment verification must be configured before any real top-up can happen.</div></div></section><section class="card"><div class="cardtitle"><h2>Earnings overview</h2></div><div class="settingrow"><div><strong>Total earnings</strong><span>Provider's net service earnings</span></div><strong>₹8,450</strong></div><div class="settingrow"><div><strong>This month</strong><span>Net earnings</span></div><strong>₹3,200</strong></div><div class="settingrow"><div><strong>Total commission</strong><span>FindVia fees charged</span></div><strong>₹950</strong></div><div class="settingrow"><div><strong>Completed jobs</strong><span>All-time demo count</span></div><strong>14</strong></div></section></div><div style="height:18px"></div><section class="card"><div class="cardtitle"><h2>Recent wallet transactions</h2><span class="tag">Demo data</span></div><div class="jobrow"><div><div class="jobname">Wallet top-up</div><div class="jobmeta">Oct 20, 2026 · Demo reference FV-TX-104</div></div><strong style="color:var(--green)">+₹500</strong></div><div class="jobrow"><div><div class="jobname">Commission deduction</div><div class="jobmeta">Oct 18, 2026 · Completed job FV-1931</div></div><strong>−₹100</strong></div></section>'}
let selectedAmount=500;
function selectAmount(a,el){selectedAmount=a;document.querySelectorAll('#amounts .tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('customAmount').value=''}
function topUp(){let val=Number(document.getElementById('customAmount').value)||selectedAmount;notify('No payment taken. Payment gateway is not connected; selected amount '+money(val)+'.')}
function profile(){return heading('YOUR ACCOUNT','Provider profile','Manage your professional information and account settings.')+'<section class="card"><div class="profilehead"><div class="avatar">P</div><div><h2 style="margin:0 0 5px">Provider Name</h2><div class="jobmeta">Provider ID: FV-P-0001</div><div style="margin-top:8px"><span class="tag amber">Verification pending</span></div></div></div><div class="profilelist">'+[['Personal details','Name, phone and email'],['Provider details','Experience, skills and bio'],['Service categories','AC repair, plumbing and more'],['Service areas','Jaipur and approved areas'],['Verification','Documents and verification status'],['Payment details','For future payout/refund support'],['Performance','Completion and response rates'],['Language','English · more languages planned'],['Notifications','Job and wallet alerts'],['Help & support','Report a problem or get help'],['Terms & privacy','Policies and account controls']].map((r,i)=>'<div class="settingrow"><div><strong>'+r[0]+'</strong><span>'+r[1]+'</span></div><button class="btn secondary small" onclick="notify(\''+r[0]+' settings will be connected in a later step.\')">Manage →</button></div>').join('')+'</div></section>'}
function notifications(){return heading('UPDATES','Notifications','Keep track of jobs, wallet activity and account updates.')+'<div class="tabs"><button class="tab active">All</button><button class="tab" onclick="notify(\'Jobs filter will use live notifications after backend connection.\')">Jobs</button><button class="tab" onclick="navigate(\'wallet\')">Wallet</button><button class="tab" onclick="navigate(\'profile\')">Account</button></div><section class="card">'+[['New job available','An AC repair request matches your selected service area.','2 min ago','green'],['Verification pending','Please submit the required identity document.','Yesterday','amber'],['Wallet update','Your demo wallet transaction is available to view.','Oct 19','']].map(n=>'<div class="jobrow"><div class="jobleft"><div class="jobicon">♧</div><div><div class="jobname">'+n[0]+'</div><div class="jobmeta">'+n[1]+'</div><div class="jobmeta" style="margin-top:5px">'+n[2]+'</div></div></div><span class="tag '+n[3]+'">Unread</span></div>').join('')+'</section>'}
function render(){renderNav();const views={home,jobs:jobsPage,wallet,profile,notifications,jobdetail:jobDetail};document.getElementById('view').innerHTML=(views[page]||home)();window.scrollTo({top:0,behavior:'smooth'})}
function navigate(p){page=p;render()}
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3200)}
render();
</script></body></html>
